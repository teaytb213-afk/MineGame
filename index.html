html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:sans-serif;color:#fff}
canvas{display:block;width:100%;height:100%}

#dpad button{flex:none;width:58px;height:58px;padding:0;font-size:26px;opacity:.8;background:#f0a500;touch-action:none}
#toast{position:fixed;top:60px;left:0;right:0;text-align:center;font-weight:bold;text-shadow:0 1px 3px #000;pointer-events:none;opacity:0;transition:opacity .3s}
#boss{position:fixed;top:34px;left:20px;right:20px;text-align:center;font-size:13px;font-weight:bold;pointer-events:none;display:none}
