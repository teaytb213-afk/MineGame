<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"><title>Шахтёр</title><style>

</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="hl"></span><span id="hr"></span></div>

<div id="shop"></div>
<script>onerror=(m,u,l)=>{document.body.insertAdjacentHTML('beforeend','<pre style="position:fixed;top:40px;left:0;right:0;z-index:9;color:#f66;background:#000b;font-size:12px;white-space:pre-wrap;margin:0;padding:6px">ОШИБКА: '+m+' (строка '+l+')</pre>')}</script>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),COLS=9,MAXR=420;
const LAY=[[0,'Земля','#8a5a2b',1],[15,'Грунт','#6e4a2a',2],[35,'Глина','#a8654a',4],[60,'Камень','#7a7d85',8],[100,'Гранит','#8d7a7a',16],[150,'Магма','#a33a1c',32],[210,'Кристаллы','#6a4fb0',64],[280,'Обсидиан','#2a2438',128],[360,'Ядро','#d9a21b',256]];
const ORES=[['Уголь',4,'#222',1,.05],['Медь',10,'#d2793a',10,.04],['Железо',22,'#d0d0d0',25,.035],['Серебро',50,'#e8f0ff',50,.03],['Золото',120,'#ffd23a',80,.025],['Рубин',300,'#ff3b5c',120,.02],['Алмаз',800,'#6ff0ff',180,.018],['Мифрил',2000,'#7dffa0',250,.015],['Звёздная руда',5000,'#ff9bff',330,.015]];
const BOSS=[[30,'Гигантский крот'],[75,'Каменный голем'],[125,'Гранитный краб'],[185,'Лавовый червь'],[250,'Кристальный дракон'],[330,'Тень обсидиана'],[399,'Сердце земли']];
const PK=[['Ложка',1,0],['Вилка',2,150],['Лопата',4,600],['Деревянная кирка',8,2500],['Железная кирка',16,9000],['Стальная кирка',32,35000],['Алмазная кирка',64,130000],['Бур',128,500000],['Лазерный бур',256,2e6]];
const UP={spd:['⚡ Скорость копания',15,l=>Math.round(60*1.6**l)],rad:['💥 Радиус копания',4,l=>Math.round(300*2.8**l)],bag:['🎒 Рюкзак',15,l=>Math.round(50*1.5**l)]};
let S={coins:0,spd:0,rad:0,bag:0,pick:0,maxD:0,items:Array(9).fill(0),def:[],seed:Math.random()*1e9|0};
try{const s=JSON.parse(localStorage.getItem('mine1'));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem('mine1',JSON.stringify(S))}catch(e){}};
const f=n=>Math.round(n).toLocaleString('ru');
function rnd(r,c,k){let h=Math.imul(r*73856093^c*19349663^k*83492791^S.seed,2654435761);h^=h>>>15;h=Math.imul(h,2246822519);h^=h>>>13;return(h>>>0)/4294967296}
const R={},bossHP={};
const layerIdx=r=>{let i=0;for(let k=0;k<LAY.length;k++)if(r>=LAY[k][0])i=k;return i};
const bossI=r=>{for(let i=0;i<BOSS.length;i++)if(r==BOSS[i][0]||r==BOSS[i][0]+1)return i;return-1};
function gen(r){const a=new Uint8Array(COLS),bi=bossI(r);
for(let c=0;c<COLS;c++){
if(bi>=0&&!S.def.includes(bi)){a[c]=99;continue}
if(bi<0&&rnd(r,c,1)<.02){a[c]=0;continue}
let t=1;for(let i=ORES.length-1;i>=0;i--)if(r>=ORES[i][3]&&rnd(r,c,2+i)<ORES[i][4]){t=10+i;break}
a[c]=t}return a}
function get(c,r){if(r<1)return 0;if(r>=MAXR)return 98;return(R[r]||(R[r]=gen(r)))[c]}
function set(c,r,v){(R[r]||(R[r]=gen(r)))[c]=v}
const bagN=()=>S.items.reduce((a,b)=>a+b,0),cap=()=>12+8*S.bag;
let W,H,T,px=4,py=0,camY=0,pt=null,prog=0,key='',mt=0,hit=0;const keys={};
function rs(){const d=devicePixelRatio||1;C.width=innerWidth*d;C.height=innerHeight*d;X.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;T=W/COLS}
addEventListener('resize',rs);rs();
let pad=null;
document.querySelectorAll('#dpad button').forEach(b=>{const d=b.dataset.d.split(',').map(Number);b.addEventListener('pointerdown',e=>{pad=d;strike();b.setPointerCapture(e.pointerId)});['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,()=>pad=null))});
C.addEventListener('pointermove',e=>{if(pt)pt={x:e.clientX,y:e.clientY}});
['pointerup','pointercancel'].forEach(n=>C.addEventListener(n,()=>pt=null));
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key==' '||e.key=='Enter')tap()});C.addEventListener('pointerdown',e=>tap(e.clientX,e.clientY));addEventListener('keyup',e=>keys[e.key]=0);
let tt;function toast(s,ms=2200){const e=document.getElementById('toast');e.textContent=s;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,ms)}
function sell(){let s=0;S.items.forEach((n,i)=>s+=n*ORES[i][1]);if(s>0){S.coins+=s;S.items.fill(0);toast('Продано на 💰'+f(s));save()}}
function up(){px=4;py=0;sell();save()}
function lift(){closeShop();const d=S.maxD;px=4;py=d;for(let y=d-1;y<=d+1;y++)for(let x=3;x<=5;x++){const t=get(x,y);if(t!=99&&t<98&&y>=1)set(x,y,0)}}
const shopOpen=()=>document.getElementById('shop').style.display=='block';
function closeShop(){document.getElementById('shop').style.display='none'}
function openShop(){if(py>0){toast('Магазин только на поверхности');return}shop()}
function buy(k){if(k=='pick'){const n=PK[S.pick+1];if(n&&S.coins>=n[2]){S.coins-=n[2];S.pick++}}else{const u=UP[k],l=S[k];if(l<u[1]&&S.coins>=u[2](l)){S.coins-=u[2](l);S[k]++}}save();shop()}
function shop(){const e=document.getElementById('shop');e.style.display='block';const n=PK[S.pick+1];
let h=`<h2>🛒 Магазин · 💰${f(S.coins)}</h2><p>⛏ Сейчас: <b>${PK[S.pick][0]}</b> (сила ${PK[S.pick][1]})</p>`+(n?`<button onclick="buy('pick')" ${S.coins<n[2]?'disabled':''}>${n[0]} (сила ${n[1]}) — 💰${f(n[2])}</button>`:'<p>🏆 Лучший инструмент!</p>');
for(const k in UP){const u=UP[k],l=S[k];h+=`<p>${u[0]} — ур. ${l}/${u[1]}</p>`+(l<u[1]?`<button onclick="buy('${k}')" ${S.coins<u[2](l)?'disabled':''}>Улучшить — 💰${f(u[2](l))}</button>`:'<p>МАКС</p>')}
h+=`<button onclick="lift()" ${S.maxD<2?'disabled':''}>🛗 Лифт на ${S.maxD} м</button><button onclick="closeShop()" style="background:#888">Закрыть</button>`;e.innerHTML=h}
function breakAt(tx,ty){const rr=S.rad?.6+S.rad*.75:0,n=Math.ceil(rr);let full=0;const got=[];
for(let dy=-n;dy<=n;dy++)for(let dx=-n;dx<=n;dx++){if(dx*dx+dy*dy>rr*rr)continue;const x=tx+dx,y=ty+dy;if(x<0||x>=COLS||y<1)continue;const t=get(x,y);if(t==0||t>=98)continue;
if(t>=10){if(bagN()<cap()){S.items[t-10]++;got.push(ORES[t-10][0]+' 💰'+ORES[t-10][1])}else full=1}set(x,y,0)}
if(got.length)toast(got.join(' · ')+(full?'  🎒 Рюкзак полон!':''),3000);else if(full)toast('🎒 Рюкзак полон! Поднимайся наверх')}
function dig(dt,tx,ty,t){const k=tx+','+ty,pw=PK[S.pick][1]*(1+.3*S.spd),h=LAY[layerIdx(ty)][3];
if(k!=key){key=k;prog=0}
if(t==98)return
if(t==99){startBattle(bossI(ty));return}
prog+=pw*dt/(h*(t>=10?1.4:1));
if(prog>=1){prog=0;breakAt(tx,ty)}}

let B=null;
const PAT=[['rain','zig','diag','wall'],['rain','side','vwall','bounce','diag'],['aim','side','fan','wall','cross','zig'],['burst','rain','ring','homing','vwall','diag','beam'],['spiral','aim','ring','beam','fan','bounce','homing'],['side','burst','aim','cross','beam','zig','wall','homing','spiral'],['rain','spiral','aim','burst','beam','ring','cross','homing','bounce','fan','wall','vwall','zig','diag']],EMO=['🐀','🗿','🦀','🪱','🐉','👻','🔥'],LINES=['Крот роет землю...','Голем грохочет!','Краб щёлкает клешнями.','Червь шипит лавой.','Дракон сверкает кристаллами.','Тень сгущается...','Сердце земли бьётся.'];
const bhp=bi=>LAY[layerIdx(BOSS[bi][0])][3]*60;
function startBattle(bi){const bs=Math.min(W*.8,H*.34);B={bi,ph:'ready',t:0,c:.5,hp:20,inv:0,sx:bs/2,sy:bs/2,bl:[],sp:.6,a:0,bs,msg:LINES[bi]};if(bossHP[bi]==null)bossHP[bi]=bhp(bi);document.getElementById('boss').style.display='none'}
function tap(x,y){if(!B)return;if(B.ph=='ready'){const s=B.bs;if(x==null||(Math.abs(x-W/2)<s*.3&&Math.abs(y-(H*.3+s/2))<26)){B.ph='atk';B.t=0}}else strike()}
function strike(){if(!B||B.ph!='atk'||B.t<.25)return;const acc=Math.max(.25,1-Math.abs(B.c-.5)*2),d=PK[S.pick][1]*(1+.3*S.spd)*8*acc;bossHP[B.bi]-=d;B.msg=(acc>.85?'ТОЧНО! ':'')+'Урон '+f(d);B.ph='hit';B.t=0;if(bossHP[B.bi]<=0)win()}
function win(){const bi=B.bi,h=LAY[layerIdx(BOSS[bi][0])][3];S.def.push(bi);for(const r of[BOSS[bi][0],BOSS[bi][0]+1])for(let c=0;c<COLS;c++)set(c,r,0);S.coins+=h*150;B=null;save();toast(bi==BOSS.length-1?'🏆 Ты победил Сердце земли! +💰'+f(h*150):'🏆 '+BOSS[bi][1]+' повержен! +💰'+f(h*150))}
function pick(bi){const p=PAT[bi].slice(),n=Math.min(p.length,2+(bi>2)+(bi>4)),r=[];while(r.length<n)r.push(p.splice(Math.random()*p.length|0,1)[0]);return r}
function mv(o,dt,b){const s=b.bs;
if(o.w!=null){o.a2=(o.a2||0)+dt;o.x=o.x0+Math.sin(o.a2*4+o.w)*28;o.y+=o.vy*dt;return}
if(o.h){const dx=b.sx-o.x,dy=b.sy-o.y,d=Math.hypot(dx,dy)||1;o.vx+=dx/d*150*dt;o.vy+=dy/d*150*dt;const m=Math.hypot(o.vx,o.vy);if(m>o.mx){o.vx*=o.mx/m;o.vy*=o.mx/m}o.life-=dt;if(o.life<0)o.x=-999}
o.x+=o.vx*dt;o.y+=o.vy*dt;
if(o.b){if(o.x<4)o.vx=Math.abs(o.vx);if(o.x>s-4)o.vx=-Math.abs(o.vx);if(o.y<4)o.vy=Math.abs(o.vy);if(o.y>s-4)o.vy=-Math.abs(o.vy);o.life-=dt;if(o.life<0)o.x=-999}}
function spawn(){const b=B,s=b.bs,k=1+b.bi*.12,ty=b.act[Math.random()*b.act.length|0],R=Math.random,P=o=>b.bl.push(o);
if(ty=='rain'){P({x:R()*s,y:-6,vx:0,vy:100*k});P({x:R()*s,y:-6,vx:0,vy:100*k})}
else if(ty=='side'){const l=R()<.5;P({x:l?-6:s+6,y:R()*s,vx:(l?1:-1)*120*k,vy:0})}
else if(ty=='aim'){const x=R()*s,a=Math.atan2(b.sy+6,b.sx-x);P({x,y:-6,vx:Math.cos(a)*110*k,vy:Math.sin(a)*110*k})}
else if(ty=='burst'){const x=s*(.2+R()*.6),y=s*.25;for(let i=0;i<8;i++){const a=i*Math.PI/4;P({x,y,vx:Math.cos(a)*80*k,vy:Math.sin(a)*80*k})}return 1}
else if(ty=='spiral'){b.a+=.6;const a=Math.PI/2+Math.sin(b.a)*1.2;P({x:s/2,y:6,vx:Math.cos(a)*90*k,vy:Math.sin(a)*90*k})}
else if(ty=='wall'){const n=Math.floor(s/22),g=Math.floor(R()*(n-2));for(let i=0;i<n;i++)if(i!=g&&i!=g+1)P({x:i*22+11,y:-6,vx:0,vy:80*k});return 1}
else if(ty=='vwall'){const n=Math.floor(s/22),g=Math.floor(R()*(n-2)),l=R()<.5;for(let i=0;i<n;i++)if(i!=g&&i!=g+1)P({x:l?-6:s+6,y:i*22+11,vx:(l?1:-1)*80*k,vy:0});return 1}
else if(ty=='cross'){const v=110*k;P({x:-6,y:b.sy,vx:v,vy:0});P({x:s+6,y:b.sy,vx:-v,vy:0});P({x:b.sx,y:-6,vx:0,vy:v});P({x:b.sx,y:s+6,vx:0,vy:-v});return 1}
else if(ty=='ring'){const r=s*.4;for(let i=0;i<12;i++){const a=i*Math.PI/6;P({x:b.sx+Math.cos(a)*r,y:b.sy+Math.sin(a)*r,vx:-Math.cos(a)*70*k,vy:-Math.sin(a)*70*k})}return 1}
else if(ty=='zig'){P({x0:R()*s,x:0,y:-6,vx:0,vy:85*k,w:R()*6})}
else if(ty=='bounce'){P({x:10+R()*(s-20),y:6,vx:(R()<.5?-1:1)*100*k,vy:100*k,b:1,life:4.5})}
else if(ty=='homing'){P({x:R()*s,y:-6,vx:0,vy:50*k,h:1,mx:95*k,life:3.2})}
else if(ty=='fan'){const x=R()*s,a=Math.atan2(b.sy+6,b.sx-x);for(let i=-2;i<=2;i++)P({x,y:-6,vx:Math.cos(a+i*.25)*105*k,vy:Math.sin(a+i*.25)*105*k});return 1}
else if(ty=='diag'){const l=R()<.5;P({x:l?4:s-4,y:-6,vx:(l?1:-1)*60*k,vy:90*k})}
else if(ty=='beam'){if(b.bm.length<2){b.bm.push({v:R()<.5,p:15+R()*(s-30),t:0});return 1}}}
function ub(dt){const b=B,s=b.bs;b.t+=dt;
if(b.ph=='atk'){b.c=.5+.5*Math.sin(b.t*5);if(b.t>4){b.msg='Промах!';b.ph='hit';b.t=0}}
else if(b.ph=='hit'){if(b.t>.8){b.ph='dodge';b.t=0;b.bl=[];b.sx=b.sy=s/2;b.sp=.6;b.inv=0;b.bm=[];b.act=pick(b.bi)}}
else if(b.ph=='dodge'){let dx=0,dy=0;if(pad){dx=pad[0];dy=pad[1]}else{dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)}
b.sx=Math.max(6,Math.min(s-6,b.sx+dx*s*.55*dt));b.sy=Math.max(6,Math.min(s-6,b.sy+dy*s*.55*dt));
b.sp-=dt;if(b.sp<=0){b.sp=Math.max(.22,.7-b.bi*.06)+(spawn()?.8:0)}
b.inv-=dt;
for(const o of b.bl){mv(o,dt,b);if(b.inv<=0&&Math.hypot(o.x-b.sx,o.y-b.sy)<10){b.hp-=4;b.inv=1;o.x=-999}}
for(const m of b.bm){m.t+=dt;if(m.t>.7&&m.t<1.1&&b.inv<=0&&Math.abs((m.v?b.sx:b.sy)-m.p)<11){b.hp-=4;b.inv=1}}b.bm=b.bm.filter(m=>m.t<1.1);
b.bl=b.bl.filter(o=>o.x>-30&&o.x<s+30&&o.y>-30&&o.y<s+30);
if(b.hp<=0){S.items.fill(0);px=4;py=0;B=null;save();toast('💀 Тебя отбросило наверх. Руда потеряна!');return}
if(b.t>5+b.bi*.4){b.ph='ready';b.t=0;b.msg=LINES[b.bi]}}}
function drawB(){const b=B,s=b.bs,bx=(W-s)/2,by=H*.3,mx=bhp(b.bi);
X.fillStyle='#000';X.fillRect(0,0,W,H);X.textAlign='center';X.textBaseline='middle';X.fillStyle='#fff';
X.font='bold 15px sans-serif';X.fillText(BOSS[b.bi][1],W/2,56);
X.fillStyle='#400';X.fillRect(W*.2,68,W*.6,10);X.fillStyle='#f33';X.fillRect(W*.2,68,W*.6*Math.max(0,bossHP[b.bi])/mx,10);
X.font='60px sans-serif';X.fillText(EMO[b.bi],W/2+Math.sin(b.t*3)*8,by-70);
X.strokeStyle='#fff';X.lineWidth=3;X.strokeRect(bx,by,s,s);
X.fillStyle='#fff';X.font='15px sans-serif';
if(b.ph=='dodge'){X.save();X.beginPath();X.rect(bx,by,s,s);X.clip();for(const o of b.bl){X.fillStyle=o.h?'#f90':o.b?'#6ff':o.w!=null?'#9f9':'#fff';X.beginPath();X.arc(bx+o.x,by+o.y,5,0,7);X.fill()}
for(const m of b.bm){if(m.t<.7){X.strokeStyle='#f33';X.lineWidth=2;X.setLineDash([6,6]);X.beginPath();if(m.v){X.moveTo(bx+m.p,by);X.lineTo(bx+m.p,by+s)}else{X.moveTo(bx,by+m.p);X.lineTo(bx+s,by+m.p)}X.stroke();X.setLineDash([])}else{X.fillStyle='#fff';if(m.v)X.fillRect(bx+m.p-9,by,18,s);else X.fillRect(bx,by+m.p-9,s,18)}}X.restore();
X.font='22px sans-serif';X.fillStyle=b.inv>0&&Math.floor(b.inv*10)%2?'#fff4':'#f33';X.fillText('♥',bx+b.sx,by+b.sy)}
else if(b.ph=='ready'){X.strokeStyle='#f90';X.lineWidth=4;X.strokeRect(W/2-s*.3,by+s/2-24,s*.6,48);X.fillStyle='#f90';X.font='bold 26px sans-serif';X.fillText('FIGHT',W/2,by+s/2)}
else if(b.ph=='atk'){X.fillStyle='#030';X.fillRect(bx+10,by+s/2-14,s-20,28);X.fillStyle='#0a0';X.fillRect(W/2-s*.08,by+s/2-14,s*.16,28);X.fillStyle='#fff';X.fillRect(bx+10+b.c*(s-20)-3,by+s/2-20,6,40);X.fillText('Жми любую кнопку в зелёной зоне!',W/2,by+s/2+44)}
else{X.fillText(b.msg,W/2,by+s/2)}
X.fillStyle='#fff';X.font='bold 15px sans-serif';X.fillText('HP '+Math.max(0,b.hp)+'/20',W/2,by+s+20);
if(b.ph=='atk'||b.ph=='ready')X.fillText(b.msg,W/2,by+s+44)}
function update(dt){if(B){ub(dt);return}if(shopOpen())return;
let dx=0,dy=0;
if(keys.ArrowLeft||keys.a)dx=-1;else if(keys.ArrowRight||keys.d)dx=1;else if(keys.ArrowUp||keys.w)dy=-1;else if(keys.ArrowDown||keys.s)dy=1;
else if(pad){dx=pad[0];dy=pad[1]}
mt-=dt;hit-=dt;
if(dx||dy){const tx=px+dx,ty=py+dy;if(tx>=0&&tx<COLS&&ty>=0){const t=get(tx,ty);
if(t==0){prog=0;key='';if(mt<=0){px=tx;py=ty;mt=.1;if(py>S.maxD){S.maxD=py;}if(py<=0)sell()}}else dig(dt,tx,ty,t)}}else{prog=Math.max(0,prog-dt)}
camY+=(py-camY)*Math.min(1,dt*8)}
function draw(){if(B){drawB();return}X.fillStyle='#111';X.fillRect(0,0,W,H);
const oy=H*.4,r0=Math.floor(camY-oy/T)-1,r1=Math.ceil(camY+(H-oy)/T)+1,sy1=(1-camY)*T+oy;
if(sy1>0){X.fillStyle='#6ec6ff';X.fillRect(0,0,W,sy1);X.fillStyle='#4caf50';X.fillRect(0,sy1-T*.15,W,T*.15);X.font=T*.9+'px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('🏪',6.5*T,sy1-T*.6)}
const sh=hit>0?(Math.random()-.5)*4:0;
for(let r=Math.max(r0,1);r<=r1;r++){const y=(r-camY)*T+oy,L=LAY[layerIdx(r)];
for(let c=0;c<COLS;c++){const t=get(c,r),x=c*T+(t==99?sh:0);
if(t==0){X.fillStyle='#1a1410';X.fillRect(x,y,T+1,T+1);continue}
if(t==98){X.fillStyle='#000';X.fillRect(x,y,T+1,T+1);continue}
X.fillStyle=t==99?'#a01c28':L[2];X.fillRect(x,y,T+1,T+1);
X.fillStyle='rgba(0,0,0,'+rnd(r,c,99)*.2+')';X.fillRect(x,y,T+1,T+1);
if(t>=10&&t<98){X.fillStyle=ORES[t-10][2];for(let k=0;k<3;k++){X.beginPath();X.arc(x+T*(.25+.5*rnd(r,c,40+k)),y+T*(.25+.5*rnd(r,c,50+k)),T*.13,0,7);X.fill()}}
if(t==99){X.fillStyle='#fff';X.fillRect(x+T*.2,y+T*.3,T*.2,T*.2);X.fillRect(x+T*.6,y+T*.3,T*.2,T*.2)}}}
if(prog>0&&key){const[a,b]=key.split(',').map(Number);X.fillStyle='rgba(0,0,0,'+prog*.6+')';X.fillRect(a*T,(b-camY)*T+oy,T,T)}
X.font=T*.8+'px sans-serif';X.textAlign='center';X.textBaseline='middle';X.fillText('👷',(px+.5)*T,(py-camY+.5)*T+oy);
if(pt&&!shopOpen()){X.strokeStyle='#fff6';X.beginPath();X.arc(pt.x,pt.y,T*.4,0,7);X.stroke()}
document.getElementById('hl').textContent='💰'+f(S.coins)+'  🎒'+bagN()+'/'+cap();
document.getElementById('hr').textContent=(py>0?'⬇'+py+' м · ':'☀ ')+LAY[layerIdx(Math.max(py,0))][1]+' · '+PK[S.pick][0];
let bs=-1;for(let k=0;k<9;k++){const b=bossI(py+k);if(b>=0&&!S.def.includes(b)){bs=b;break}}
const be=document.getElementById('boss');if(bs>=0){be.style.display='block';document.getElementById('bn').textContent='👹 '+BOSS[bs][1];const mx=LAY[layerIdx(BOSS[bs][0])][3]*60;document.getElementById('bi').style.width=((bossHP[bs]??mx)/mx*100)+'%'}else be.style.display='none'}
let last=performance.now();
(function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
setInterval(save,10000);
toast('Зажми стрелку, чтобы копать');
